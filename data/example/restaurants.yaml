# EXAMPLE DATA — every restaurant below is invented.
#
# This file belongs to the upstream project. Leave it alone: it's the fallback
# the site uses before you've added your own list, and deleting or editing it
# will cause merge conflicts when you sync with upstream.
#
# Your list goes in  data/restaurants.yaml  alongside this one, and takes
# precedence automatically. `python scripts/setup.py` will create it for you.
#
# ---------------------------------------------------------------------------
#
# HOW TO ADD A RESTAURANT
#   Copy an existing block, paste it at the end, change the values.
#   Keep the two-space indent and the leading "- " on the "id:" line.
#
#   Write your group's own acceptance criteria here — what makes somewhere a
#   sensible place for you to meet. The example criteria below are a starting
#   point, not rules handed down from anywhere:
#     * decent seating for a group
#     * a real dining room; ordering at the counter is fine
#     * affordable enough that everyone has a real choice
#     * a menu with enough range that nobody is stuck with nothing they can eat
#     * quiet enough to hold a conversation
#     * still serving when you actually arrive
#
# HOW TO REMOVE ONE
#   Set  active: no  instead of deleting it. That keeps its history intact,
#   and always say why in the notes.
#
#   If a place is fine but just too pricey for a normal month, DON'T retire
#   it. Leave  active: yes  and set  category: special  instead. Those stay
#   out of the normal draw, and the site can list them on their own.
#
# FIELDS
#   id       required, unique, lowercase-with-dashes. NEVER change it after a
#            visit is recorded — data/history.csv points at it.
#   name     required, and JUST the name. Don't put the location in it — the
#            site adds the area itself. Two branches of one chain are told
#            apart by their area and address.
#   area     required, must be one of the areas in config.json
#   address  optional but worth filling in. No quotes needed despite commas.
#   cuisine  optional, free text
#   open_days  optional. The days they're open AND still serving when you
#            start. Space-separated, from Mon Tue Wed Thu Fri Sat Sun.
#            Leave it out if you don't know — missing means "assume open".
#   category optional, normal (the default) or special.
#   notes    optional, free text. Record WHY a judgement was made, not just
#            what — the reason is what stops it being re-litigated later.
#   active   yes or no. no means closed or ruled out, NOT expensive.
# ---------------------------------------------------------------------------

restaurants:

  # === Downtown =============================================================

  - id: market-street-pizza
    name: Market Street Pizza
    area: Downtown
    address: 14 Market St, Downtown
    cuisine: Pizza
    open_days: Mon Tue Wed Thu Fri Sat Sun
