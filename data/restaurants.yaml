# CSRA Mesh monthly meetup — restaurant list
#
# HOW TO ADD A RESTAURANT
#   Copy an existing block, paste it at the end, change the values.
#   Keep the two-space indent and the leading "- " on the "id:" line.
#
#   To qualify, a place must have:
#     * decent seating for a group
#     * a real dining room. Ordering at the counter is fine — we've met at
#       McAlister's. Drive-thru fast food is not.
#     * enough decent food under $20 that everyone has a real choice. The
#       test is what you CAN eat for under $20, not what the top of the menu
#       costs — a few expensive dishes don't disqualify anywhere. The Feed
#       Sack and Ironwood Tavern both stay in normal rotation on that basis
#       even though listings quote them higher. Somewhere only goes on the
#       special list when there isn't enough under $20 to choose from.
#     * a menu with enough range that nobody in the group is stuck with
#       nothing they can eat
#     * a noise level you can hold a conversation over. We retired Doc's
#       Porchside over this one.
#     * ordering that works for a mixed group. Everyone should be able to
#       order their own plate. We retired Meimei's because dim sum means
#       ordering a la carte and sharing, which trips up anyone new to it.
#     * still serving at 6:30pm, since that's always our start time. K and J
#       closed at 6 and was no use to us.
#     * billing that works for a big group — they'll split checks, and there's
#       no surprise automatic gratuity. Worth asking when you call ahead.
#       Frog and the Hen is off the list for doing both.
#     * an actual building. Delivery-only "ghost kitchen" brands show up on
#       listings sites looking like real restaurants. Click the map link — if
#       it lands on a different restaurant's address, that's what it is. The
#       Saucy Hen caught us this way.
#
# HOW TO REMOVE ONE
#   Set  active: no  instead of deleting it. That keeps its history intact,
#   and always say why in the notes. Use this for places that have closed or
#   that we've ruled out for good.
#
#   If a place is fine but just too pricey for a normal month, DON'T retire
#   it. Leave  active: yes  and set  category: special  instead. Those stay
#   out of the normal draw, but the site can list them on their own when
#   we're planning a holiday dinner.
#
# FIELDS
#   id       required, unique, lowercase-with-dashes. NEVER change it after a
#            visit is recorded — data/history.csv points at it.
#   name     required, as you'd say it out loud, and JUST the name. Don't put
#            the location in it — no "The Feed Sack (Aiken)". The site adds
#            the area itself, so that would come out as "... (Aiken) — Aiken".
#            Two branches of the same chain are told apart by their area and
#            address, which is what those fields are for.
#   area     required, must be one of:
#            Augusta, South Augusta, Hephzibah, Martinez, Evans,
#            Grovetown, North Augusta, Aiken
#   address  optional but please fill it in. No quotes needed even though it
#            has commas. Left blank, the map link just searches the name.
#   cuisine  optional, free text
#   open_days  optional. The days they're open AND still serving at our
#            6:30pm start. Space-separated, from Mon Tue Wed Thu Fri Sat Sun:
#              open_days: Mon Tue Wed Thu Fri
#            Leave it out if you don't know. The picker treats a missing
#            value as "assume open every day", so this can be filled in a
#            few at a time rather than all at once.
#   category optional, either normal (the default) or special.
#            special = a real, open restaurant that's too pricey for a normal
#            month. Kept out of the usual draw, listed separately.
#   notes    optional, free text — hours, parking, "big back room", etc.
#   active   yes or no. no means closed or ruled out for good, NOT expensive.
#
# ---------------------------------------------------------------------------
# SEEDED 2026-08-05, addresses looked up 2026-08-06 from current online
# listings. Addresses should be right but nobody has stood outside these
# buildings to check. Prices and opening hours are NOT verified — several
# entries carry a note saying so. Anything still worth a second look says
# what's wrong in its notes field.
# ---------------------------------------------------------------------------

